name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Build migration bundle
        run: >
          dotnet ef migrations bundle
          --project Prost.Api
          --configuration Release
          --no-build
          --self-contained
          --target-runtime linux-x64
          --output artifacts/efbundle
          --force

      - name: Package migration bundle
        run: tar -czf artifacts/efbundle.tar.gz artifacts/efbundle

      - name: Upload migration bundle
        uses: actions/upload-artifact@v7
        with:
          name: efbundle
          path: artifacts/efbundle.tar.gz
          if-no-files-found: error
          retention-days: 7