name: CD
run-name: ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Download migration bundle
        uses: actions/download-artifact@v7
        with:
          name: efbundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract migration bundle
        run: tar -xzf efbundle.tar.gz

      - name: Apply migrations
        env:
          ConnectionStrings__Postgres: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        run: ./artifacts/efbundle

      - name: Deploy API
        run: >
          curl --fail-with-body -X POST
          "${{ secrets.API_DEPLOY_HOOK_URL }}&ref=${{ github.event.workflow_run.head_sha }}"