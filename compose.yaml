services:
  api:
    build:
      context: .
      dockerfile: Prost.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Postgres: Host=postgres; Port=5432; Database=${POSTGRES_DATABASE}; Username=${POSTGRES_USERNAME}; Password=${POSTGRES_PASSWORD}; GSS Encryption Mode=Disable;
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: Prost.Api/Dockerfile.migration
    environment:
      ConnectionStrings__Postgres: Host=postgres; Port=5432; Database=${POSTGRES_DATABASE}; Username=${POSTGRES_USERNAME}; Password=${POSTGRES_PASSWORD}; GSS Encryption Mode=Disable;
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data: